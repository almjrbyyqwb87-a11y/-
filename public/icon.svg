<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glow ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Main Card Graphic -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#cardGrad)" filter="url(#glow)" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="256" cy="210" r="54" fill="#ffffff" />
  
  <!-- Shoulders / Body -->
  <path d="M 166 348 C 166 288 206 270 256 270 C 306 270 346 288 346 348 Z" fill="#ffffff" />

  <!-- Online/Star Emerald Badge -->
  <circle cx="370" cy="142" r="28" fill="#0f172a" />
  <circle cx="370" cy="142" r="20" fill="url(#accentGrad)" />

  <!-- Mini phone waves -->
  <path d="M 390 230 A 50 50 0 0 1 390 282" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round" />
  <path d="M 408 215 A 75 75 0 0 1 408 297" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round" />
</svg>
